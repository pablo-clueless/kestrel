# Kestrel on Fly.io: one private machine running the engine with the UI built in.
#
# There's no login, so the app gets NO public IP. You reach it through `fly proxy` over Fly's
# WireGuard, so only members of your Fly org can use it.
#
# First deploy:
#   fly apps create <your-app-name>                  # then set `app` below to the same name
#   fly secrets set KESTREL_DATABASE_URL='postgres://…?sslmode=require' \
#                   KESTREL_SECRETS_KEY=$(openssl rand -hex 32)   # keep a copy of this key elsewhere too
#   fly deploy --no-public-ips --ha=false            # exactly one machine: live runs are held in its memory
#
# Use it:
#   fly proxy 7070:7070                              # then open http://localhost:7070
#
# Later deploys: `fly deploy --no-public-ips --ha=false` again. Check nothing public was allocated with
# `fly ips list` (it should be empty or private-only).

app = "kestrel"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # IPv6 any-address: Fly's private network (and `fly proxy`) is IPv6.
  KESTREL_BIND = "::"
  KESTREL_PORT = "7070"
  KESTREL_WORKSPACE_DIR = "/data"

# All data is in Postgres (KESTREL_DATABASE_URL), so no volume is needed.
#
# Upgrading a deployment that kept its data on the `kestrel_data` volume (SQLite)? Uncomment this,
# deploy, run `fly ssh console -C "kestrel-engine import-sqlite /data/workspaces"` once, then
# comment it out again and `fly volumes destroy` the volume when you're satisfied.
# [mounts]
#   source = "kestrel_data"
#   destination = "/data"

# No [http_service] / [[services]] on purpose: nothing is routed through Fly's public proxy.

# Dedicated CPU: shared CPU steals cycles, and that jitter shows up in latency numbers. For light use,
# `cpu_kind = "shared"` is cheaper.
[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"

[checks]
  [checks.alive]
    type = "http"
    port = 7070
    path = "/healthz"
    method = "get"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
